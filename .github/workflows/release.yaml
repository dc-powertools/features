name: "Features - Release"
on:
  workflow_run:
    workflows: ["Features - Main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Filter features that need publishing
        id: filter
        run: bash .github/scripts/filter-unpublished.sh

      - name: Install latest dcc
        if: steps.filter.outputs.needs_publish != '0'
        run: bash .github/scripts/install-dcc.sh

      - name: Validate changed feature metadata
        if: steps.filter.outputs.needs_publish != '0'
        run: dcc feature validate .publish-staging

      - name: Set up Node.js 24
        if: steps.filter.outputs.needs_publish != '0'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Dev Container CLI
        if: steps.filter.outputs.needs_publish != '0'
        run: npm install --global @devcontainers/cli@0.89.0

      - name: Publish changed features
        if: steps.filter.outputs.needs_publish != '0'
        run: |
          devcontainer features publish \
            --registry ghcr.io \
            --namespace dc-powertools/features \
            .publish-staging
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Tag published features
        if: steps.filter.outputs.needs_publish != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for feature_dir in .publish-staging/*/; do
              feature="$(basename "$feature_dir")"
              version="$(jq -r .version "${feature_dir}devcontainer-feature.json")"
              git tag "${feature}@${version}"
              echo "Tagged ${feature}@${version}"
          done
          git push --tags
