name: "Features - Test"
on:
  workflow_dispatch:
    inputs:
      only_changes:
        type: boolean
        description: 'only test changes'
        default: false

  workflow_call:
    inputs:
      only_changes:
        type: boolean
        description: 'only test changes'
        default: false

  pull_request:

  push:
    branches:
      - main

jobs:

  enumerate-features:
    runs-on: ubuntu-latest
    name: Find feature
    outputs:
      features: ${{ steps.enumerate-features.outputs.features }}
    steps:
      - uses: actions/checkout@v3
      - id: resolve_args
        run: |
          only_changes=${{ inputs.only_changes }}

          if [ ${only_changes} == '' ]; then
            if [ ${{ github.event_name }} == 'pull_request' ]; then
              only_changes=true
            elif [ ${{ github.event_name }} == 'push' ]; then
              only_changes=true
            fi
          fi
          echo 'only_changes=${only_changes}' >> $GITHUB_OUTPUT

      - run: |
          echo ${{ inputs.only_changes  }}
          echo ${{ github.event_name  }}

      - id: enumerate-features
        uses: ./.github/actions/enumerate-features
        with:
          path: .
          only_changes: ${{ steps.resolve_args.only_changes }}

  test:
    needs: [enumerate-features]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: ${{ fromJson(needs.enumerate-features.outputs.features) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Install latest `dcc`
        run: curl -fsSL https://raw.githubusercontent.com/dc-powertools/dcc/main/install.sh | bash

      - name: Shell Linter
        run: |
          set -e
          shellcheck --severity=error -e SC2148 src/"${{ matrix.feature }}"/*.sh

      - name: "Test feature '${{ matrix.feature }}'"
        run: |
          set -e
          echo
          for test in "test/${{ matrix.feature }}/"*.sh; do
            $(
              FAILED=()
              check() {
                LABEL=$1
                shift
                echo -en "\n• testing [$LABEL]"
                if "$@"; then
                  echo -e "\r\e[K\xE2\x9C\x93 passed  [$LABEL]"
                  return 0
                else
                  echo -e "\r\e[K\xE2\x9C\x97 failed  [$LABEL]"
                  FAILED+=("$LABEL")
                  return 1
                fi
              }

              reportResults() {
                if [ \${#FAILED[@]} -ne 0 ]; then
                  echoStderr -e "\nFailed tests: \${FAILED[@]}"
                  exit 1
                else
                  echo -e "\nTest Passed!"
                  exit 0
                fi
              }

              featurepath() {
                echo "../src/${{ matrix.feature }}"
              }

              test_name=$(echo ${test: 0:-3} | grep -o '[^/]\+$')
              echo "** Test: ${test_name} **"

              source "$test"

              profile="${{ matrix.feature }}--${test_name}"
              configure > ".devcontainer/${profile}.json"

              dcc build -p "${profile}"

              dcc run -p "${profile}" -- "source '${test}'; test"
            )
          done

