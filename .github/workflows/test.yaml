name: "Features - Test"
on:
  workflow_dispatch:
    inputs:
      on_changes_only:
        type: boolean
        description: 'on_changes_only'
        default: false

      enabled:
        type: boolean
        description: 'enabled'
        default: true

  workflow_call:
    inputs:
      on_changes_only:
        type: boolean
        description: 'on_changes_only'
        default: false

      enabled:
        type: boolean
        description: 'enabled'
        default: true

  schedule:
    # every day at 01:00
    - cron:  '0 1 * * *'

  pull_request:

  push:
    branches:
      - main

jobs:

  find-features:
    if: ${{ ( ( github.event_name != 'workflow_call' ) && ( github.event_name != 'workflow_dispatch' ) ) || inputs.enabled  }}
    runs-on: ubuntu-latest
    name: Find feature
    outputs:
      all-features: ${{ steps.list-features.outputs.all_features }}
      changed-features: ${{ steps.list-features.outputs.changed_features }}
    steps:
      - uses: actions/checkout@v3
      - run: |
          echo ${{ inputs.enabled  }}
          echo ${{ github.event_name  }}

      - id: list-features
        uses: ./.github/actions/list-changed-features-action
        with:
          path: .

  prepare-features:
    needs: [find-features]
    runs-on: ubuntu-latest
    outputs:
      features_to_test: ${{ steps.resolve_features.outputs.features_to_test }}
    steps:
      - name: "resolving features to test"
        id: resolve_features
        run: |
          only_changes=${{ inputs.on_changes_only }}

          if [ ${only_changes} == '' ]; then
            if [ ${{ github.event_name }} == 'pull_request' ]; then
              only_changes=true
            elif [ ${{ github.event_name }} == 'push' ]; then
              only_changes=true
            elif [ ${{ github.event_name }} == 'workflow_dispatch' ]; then
              only_changes=false
            elif [ ${{ github.event_name }} == 'workflow_call' ]; then
              only_changes=false
            elif [ ${{ github.event_name }} == 'schedule' ]; then
              only_changes=false
            fi
          fi

          if [ ${only_changes} == 'true' ]; then
            echo 'features_to_test=${{ needs.find-features.outputs.changed-features }}' >> $GITHUB_OUTPUT
          else
            echo 'features_to_test=${{ needs.find-features.outputs.all-features }}' >> $GITHUB_OUTPUT
          fi

  test:
    if: ${{ fromJson(needs.prepare-features.outputs.features_to_test)[0] != null }}
    needs: [find-features, prepare-features]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating test scenarios for '${{ needs.prepare-features.outputs.features_to_test }}'"
        run: |
          comma_separated_features=${{ needs.prepare-features.outputs.features_to_test }}
          feature_array=("${comma_separated_features//,/ }")
          devcontainer features test -f ${feature_array[*]} --skip-autogenerated .

      - name: Shell Linter
        run: |
          set -e

          # install shellcheck
          comma_separated_features=${{ needs.prepare-features.outputs.features_to_test }}

          for i in ${comma_separated_features//,/ }
          do
            shellcheck --severity=error -e SC2148 src/"$i"/*.sh
          done

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
