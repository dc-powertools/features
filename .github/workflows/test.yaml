name: "Features - Test"
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          features=$(find test -maxdepth 2 -name 'scenarios.json' \
            | sed 's|test/||;s|/scenarios.json||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "features=$features" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.discover.outputs.features) }}
    steps:
      - uses: actions/checkout@v5
      - name: Test ${{ matrix.feature }}
        run: test/run-scenarios.sh ${{ matrix.feature }}
